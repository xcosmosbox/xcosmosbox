name: Let's build / 交流与合作
description: Start a conversation about a project, collaboration, or engineering opportunity.
title: "Hello: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out! English and 中文 are both welcome.
        This is a public conversation; share only details you want visible here.
  - type: dropdown
    id: topic
    attributes:
      label: What brings you here? / 想聊什么？
      options:
        - Open-source collaboration / 开源合作
        - Engineering opportunity / 工作机会
        - Project discussion / 项目交流
    validations:
      required: true
  - type: textarea
    id: conversation
    attributes:
      label: Tell me a little more / 展开聊聊
      description: What are you working on, and how could we work together?
      placeholder: A short introduction, your idea, and any relevant public links.
    validations:
      required: true
