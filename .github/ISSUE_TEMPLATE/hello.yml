name: 打个招呼 / Say hi
description: 代码、脑洞或者一句 hello，欢迎串门。
title: "Hello 👋 "
body:
  - type: markdown
    attributes:
      value: |
        欢迎串门！中文 / English 都可以。
        这里是公开留言区，私人联系方式就别往里面放啦。
  - type: textarea
    id: hello
    attributes:
      label: 想聊点什么？ / What's on your mind?
      placeholder: 一个脑洞、一个项目，或者随便聊聊。
    validations:
      required: true
